name: Build

on:
  # Build EVERY pull request (base `dev` OR `main`) so each PR is a
  # gateable pre-merge status check.
  # NOTE: `pull_request` branch filters match the PR *base* (target)
  # branch, not the head. The previous `branches-ignore: [dev, feat*, …]`
  # therefore disabled builds for PRs *into* `dev` — our default branch
  # and the merge target of every feature PR — so red shipped unseen.
  # Removed deliberately; never re-add a base filter that hides `dev` PRs.
  #
  # NO path filter (`paths`/`paths-ignore`) here, deliberately: the branch
  # ruleset requires the `Build and check on {ubuntu,macos,windows}`
  # contexts to pass before merge. A path-skipped workflow emits NO check
  # runs, so those required contexts would never report and EVERY docs-only
  # PR would be permanently BLOCKED from merge (empirically reproduced on
  # PR #48). Both keys skip identically — `paths-ignore` on PRs touching
  # only ignored globs, `paths` on PRs touching none of the listed globs —
  # so the invariant is "no file-path filter", enforced by the guard step
  # below. Docs PRs therefore build in full and report a real pass;
  # `concurrency` below cancels superseded runs so iteration doesn't pile
  # up. The `push` trigger likewise carries NO path filter (see its own
  # note below) — there is no glob list anywhere, by design.
  pull_request:
  # Build only integration-branch pushes. Feature and `dependabot/**`
  # branches are already covered by their PR run above; gating them here
  # too would double-run (push + PR). No `tags:` trigger: a `v*` tag is
  # cut on `main` HEAD *after* a dev→main ff-merge, and that exact commit
  # is built by this `push` (main) run — so the tagged tree is already
  # validated; release.yml then only publishes. This `branches` allow-list
  # is the single-run-per-change contract the old (misplaced, base-side)
  # `branches-ignore` was trying — and failing — to express.
  push:
    branches: [main, dev]
    # No `paths-ignore`: the README badge reads dev HEAD's build check-run, so
    # every dev commit must build — a docs-only skip blanks it to "no check
    # runs". This trigger only ever sees owner direct-pushes anyway (`/ff` bot
    # merges are GITHUB_TOKEN-suppressed), so the old filter merely suppressed
    # the very pushes that must build to keep the badge truthful.
  # Seeds the Gradle caches every PR restores. A PR can read caches only from
  # its own ref and the default branch (`dev`), and `/ff` merges never build
  # `dev` (GITHUB_TOKEN pushes trigger nothing), so without this every PR's
  # first run starts cold. Schedules always run on the default branch. Twice a
  # week keeps the gap under GitHub's 7-day eviction of unused entries; a
  # failure here also flags upstream drift on an unchanged `dev`.
  schedule:
    - cron: '17 3 * * 1,4'
  # Re-seed right after a merge that changes dependencies, instead of waiting for
  # the schedule: `gh workflow run build.yml --ref dev` (a user token, so not
  # suppressed like the `/ff` bot's push).
  workflow_dispatch:

# Cancel superseded runs on the same ref. Without this, rapid
# force-pushes during PR iteration spawn parallel runs
# (one job per OS × lane) that keep
# burning runner minutes even though the user only cares about
# the latest push. `group` keys on PR number when on a PR
# (cancels prior runs for the SAME PR) or on the ref otherwise.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  # `contents: read` is sufficient now that dependency-graph
  # submission moved to dependency-submission.yml. Previously we
  # needed `write` for that submission. No other step in build.yml
  # writes back to git.
  contents: read
  # SARIF uploads (Detekt + Lint via codeql-action/upload-sarif) require
  # `security-events: write`; `actions: read` is required by upload-sarif
  # (incl. private repos). CodeQL *analysis* moved to codeql.yml, but
  # these stay — upload-sarif needs them independently of CodeQL.
  security-events: write
  actions: read
  # We appear to need write permission for both pull-requests and
  # issues to post a comment to a pull request.
  pull-requests: write
  issues: write

env:
  CI: true
  BUILD_NUMBER: ${{ github.run_number }}
  SCM_TAG: ${{ github.sha }}
  #GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  # Dependency-graph filter regexes live in
  # dependency-submission.yml now (the inline graph-submit step here
  # was removed alongside the `contents: write` tightening).

# Layout: one job per (OS, lane) so wall time is the slowest lane, not the sum
# of all lanes (a routine lane must stay under 5 minutes). The ruleset requires
# the contexts `Build and check on {ubuntu,macos,windows}`, so per-OS `verdict-*`
# jobs carry those exact names and depend only on their own OS's lanes: each
# context stays true for its OS. Lane jobs share one anchored strategy and step
# list (GitHub supports anchors but not `<<:` merge keys, so only `runs-on`
# differs per OS job).
jobs:
  # Gradle-free repository guards, once per run instead of once per lane.
  preflight:
    name: Preflight
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    steps:
      - &harden
        name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify wrapper-pin alignment
        # Each composite check pins Gradle deliberately for matrix coverage:
        # root/checks/latest pick the build-side ceiling; checks/js-only
        # holds the floor. Future commits that bump or add a check module
        # MUST update this gate in lockstep so drift is detected at PR time
        # — not after a baseline run silently regenerates against the wrong
        # version.
        shell: bash
        run: |
          expect() {  # $1=path  $2=expected-version-regex
            local pin
            pin=$(grep '^distributionUrl' "$1/gradle/wrapper/gradle-wrapper.properties")
            echo "$pin" | grep -qE "gradle-$2-" || {
              echo "::error file=$1/gradle/wrapper/gradle-wrapper.properties::wrapper drifted (expected $2): $pin"
              exit 1
            }
          }
          expect .                  '9\.8\.0'
          expect checks/latest      '9\.8\.0'
          expect checks/kgp-only    '9\.8\.0'
          expect checks/dual        '9\.8\.0'
          expect checks/middle      '8\.14\.5'
          expect checks/js-only     '7\.6\.6'

      - name: Forbid committed Kotlin/JS lockfiles
        # `kotlin-js-store/` is gitignored on purpose: a bare yarn.lock (no
        # package.json) makes GitHub raise npm Dependabot alerts on never-
        # shipped dev-toolchain deps + aborts security-update runs. gitignore
        # stops accidental adds; this gate stops a deliberate `git add -f`
        # (or a removed ignore rule) from silently resurrecting the alerts.
        # Kotlin regenerates the store per build — it must never be committed.
        shell: bash
        run: |
          # Match files *inside* a kotlin-js-store dir at any depth (root or
          # nested) — mirroring .gitignore's depth-agnostic `kotlin-js-store/`.
          # NOT a bare `*kotlin-js-store*` substring, which false-positives on
          # unrelated paths (e.g. docs-kotlin-js-store-notes.txt).
          tracked=$(git ls-files '*/kotlin-js-store/*' 'kotlin-js-store/*')
          if [ -n "$tracked" ]; then
            echo "::error::Committed kotlin-js-store/ lockfile(s) below. These are gitignored on purpose: a bare yarn.lock raises npm Dependabot alerts on never-shipped JS-toolchain deps + aborts security-update runs. Fix: 'git rm --cached <file>' (Kotlin regenerates them per build)."
            echo "$tracked"
            exit 1
          fi

      - name: Forbid path filters on the pull_request trigger
        # Self-guard (ubuntu runners ship yq). The branch ruleset requires
        # this workflow's `Build and check on *` verdict contexts; an
        # `on:`-level path filter emits NO check runs for a non-matching
        # PR, so re-adding EITHER `paths-ignore` OR `paths` to
        # `pull_request` would silently make every docs-only PR
        # un-mergeable (the contexts never report) — see the `on:` block
        # comment. Both keys cause the identical skip: `paths-ignore`
        # drops PRs touching only ignored globs; `paths` drops PRs
        # touching none of the listed globs — so the invariant is "no
        # file-path filter at all", not just "no paths-ignore". This gate
        # converts that regression into an immediate red on the next code
        # PR, instead of a mystery BLOCKED docs PR. `.["on"]` quotes the
        # key: YAML 1.1 reads bare `on` as a boolean.
        shell: bash
        run: |
          set -euo pipefail
          # Fail CLOSED. A fail-open guard on a merge-gate is worse than none —
          # it reads as "verified" while verifying nothing. `set -e` makes a
          # missing/erroring yq abort the step; the `*)` arm blocks any
          # unexpected output (empty/null from a restructured trigger) instead
          # of silently passing.
          has_filter=$(yq '.["on"].pull_request | (has("paths-ignore") or has("paths"))' .github/workflows/build.yml)
          case "$has_filter" in
            false) ;;
            true)
              echo "::error file=.github/workflows/build.yml::A path filter (paths-ignore/paths) on the pull_request trigger is forbidden: a path-skipped workflow emits no check runs, so the ruleset-required 'Build and check on *' contexts never report and docs-only PRs are BLOCKED from merge forever. Keep path filtering on push only."
              exit 1 ;;
            *)
              echo "::error file=.github/workflows/build.yml::path-filter guard could not evaluate the pull_request trigger (yq returned '$has_filter') — failing closed. Check the yq expression / build.yml structure."
              exit 1 ;;
          esac

  lanes-ubuntu:
    name: 'ubuntu: ${{ matrix.lane }}'
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    # Bounds a hang only; the lane step's own 5-minute limit is the real budget.
    timeout-minutes: 10
    env:
      GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: false
      GITHUB_DEPENDENCY_GRAPH_ENABLED: false
    strategy: &lanes
      fail-fast: false
      matrix:
        include:
          # Root: the plugin itself (build, Detekt, Lint, own API dump,
          # dependency-guard). Unqualified `dependencyGuard`: the root project
          # has no `check` task, so its buildscript-classpath baseline
          # (dependencies/classpath.txt) is verified only when named here.
          # No `--warning-mode=fail`: third-party plugins still call Gradle
          # APIs deprecated for removal (Detekt 1.23: `ReportingExtension.file`;
          # BCV: `Configuration.setVisible`). Re-check with
          # `--warning-mode=all` after bumping either.
          - lane: root
            dir: .
            run: ./gradlew build assemble check dependencyGuard --continue --stacktrace --scan
          # Ceiling: newest Kotlin preview + BCV, Gradle of the root wrapper.
          - lane: latest
            dir: checks/latest
            run: ./gradlew check --continue --stacktrace --scan
          # Matrix interior: catches drift between floor and ceiling (BCV
          # 0.14→0.16 worker isolation, Kotlin 2.0→2.4 metadata rename) so a
          # regression does not first surface on the ceiling. The BCV 0.14 row
          # leaves a `.d.ts` in `build/api`, then checks that the plugin's
          # cleaner removes it before that BCV's `jvmApiCheck` (see its build).
          - lane: middle
            dir: checks/middle
            run: ./gradlew check --continue --stacktrace --scan && ./gradlew jvmApiBuild tsApiBuild -PbcvVersion=0.14.0 --stacktrace && ./gradlew jvmApiCheck -PbcvVersion=0.14.0 --stacktrace
          # Embedded-only: KGP `abiValidation`, no external BCV; also verifies
          # KGP's KLIB ABI baseline. `apiDump --dry-run` stores AND reloads
          # the configuration-cache entry for the dump tasks without writing
          # baselines: the only no-BCV cell under CC, so the only place a
          # dump task that needs BCV classes to deserialize would fail.
          - lane: kgp-only
            dir: checks/kgp-only
            run: ./gradlew check checkKotlinAbi --continue --stacktrace --scan && ./gradlew apiDump --dry-run --stacktrace
          # Both validators: `sweep` runs every preferEmbedded mode and asserts
          # the lifecycle line and resolved baseline layout. Runs on every OS,
          # so the `/`-separated layout it asserts is checked on Windows too.
          - lane: dual
            dir: checks/dual
            run: ./sweep
          # Floor: Gradle 7.6 cannot build the plugin (KGP 2.x, plugin-publish
          # 2.x), so root Gradle publishes it to fluxo-bcv-js/build/checks-repo
          # and the cell resolves the published plugin, on JDK 17 (Gradle 7.6
          # runs on Java <= 19). No `--scan` on the 7.6 build: Gradle 7.6 does
          # not know the `com.gradle.develocity` id, so `--scan` also applies
          # the old Gradle Enterprise plugin and configuration fails on the pair.
          - lane: js-only
            dir: checks/js-only
            run: ../../gradlew -p ../.. :plugin:publishAllPublicationsToChecksRepository --stacktrace && JAVA_HOME="$JDK17" ./gradlew check --continue --stacktrace
    steps: &lane-steps
      - *harden
      - *checkout

      - name: 'Set up JDK 17 (checks/js-only: Gradle 7.6 runs on Java <= 19)'
        if: matrix.lane == 'js-only'
        id: jdk17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # Set up last so it stays the default JAVA_HOME for every other step.
      - name: 'Set up JDK 21'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          # `gradle-home-cache-cleanup: true` was deprecated in gradle/actions
          # v4 → `cache-cleanup`. `on-success` is its documented successor
          # (and current default): prune stale Gradle Home entries only after
          # a successful build, before saving the Actions cache.
          cache-cleanup: on-success
          # Cached on Windows too: it is the slowest OS, so it gains most from
          # a warm cache. Measure both before ever disabling it there.
          cache-encryption-key: "${{ secrets.GRADLE_ENCRYPTION_KEY }}"
          # `cache-read-only` stays at its default: writable on `dev` (the
          # `schedule` and owner pushes), read-only on PRs. PRs restore `dev`'s
          # entries, so even a PR's first run is warm, and one entry per lane
          # job stays under the 10 GB repo cap. Per-PR writes would add one
          # entry per lane job for every open PR.
          # Dependency-graph submission moved to its own workflow
          # (dependency-submission.yml) so build.yml can run with
          # `contents: read`. The split also decouples graph-submit
          # failures from the build matrix outcome.
          dependency-graph: disabled
          add-job-summary-as-pr-comment: on-failure
          artifact-retention-days: 1

      # A routine lane over 5 minutes is a failure, not a slow pass.
      - name: 'Run ${{ matrix.lane }}'
        timeout-minutes: 5
        working-directory: ${{ matrix.dir }}
        shell: bash
        env:
          JDK17: ${{ steps.jdk17.outputs.path }}
        run: ${{ matrix.run }}

      - name: Upload sarif report (Detekt)
        if: always() && matrix.lane == 'root'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: build/detekt-merged.sarif
          category: detekt

      - name: Upload sarif report (Lint)
        if: always() && matrix.lane == 'root'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: build/lint-merged.sarif
          category: lint

      - name: Upload the build report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: '${{ runner.os }}-${{ matrix.lane }}-build-report'
          path: |
            **/build/logs/
            **/build/reports/
            **/build/output/
            build/*-merged.*
          compression-level: 9

  lanes-macos:
    name: 'macos: ${{ matrix.lane }}'
    runs-on: macos-latest
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    timeout-minutes: 10
    env:
      GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: false
      GITHUB_DEPENDENCY_GRAPH_ENABLED: false
    strategy: *lanes
    steps: *lane-steps

  lanes-windows:
    name: 'windows: ${{ matrix.lane }}'
    runs-on: windows-latest
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    timeout-minutes: 10
    env:
      GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: false
      GITHUB_DEPENDENCY_GRAPH_ENABLED: false
    strategy: *lanes
    steps: *lane-steps

  # Ruleset-required contexts (exact names, also the README badge filter):
  # renaming one silently detaches the merge gate. `!cancelled()` instead of
  # `always()`: a superseded run must not post a failure.
  verdict-ubuntu:
    name: Build and check on ubuntu
    needs: [preflight, lanes-ubuntu]
    if: ${{ !cancelled() && !contains(github.event.head_commit.message, 'ci skip') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      OS: ubuntu
    steps: &verdict-steps
      # A matrix job's `result` is `success` only when every leg succeeded.
      - name: Require preflight and every lane of this OS
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::preflight or a $OS lane did not succeed (results: $RESULTS); open the failed job above"; exit 1; }
          done

      - name: "Post result in PR comment"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: github.event_name == 'pull_request' && failure()
        env:
          GH_WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { OS, GH_WORKFLOW, RUN_URL } = process.env
            github.rest.issues.createComment({
              issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo,
              body: `❌ ${GH_WORKFLOW} [failed](${RUN_URL}) on ${OS}.`,
            })

  verdict-macos:
    name: Build and check on macos
    needs: [preflight, lanes-macos]
    if: ${{ !cancelled() && !contains(github.event.head_commit.message, 'ci skip') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      OS: macos
    steps: *verdict-steps

  verdict-windows:
    name: Build and check on windows
    needs: [preflight, lanes-windows]
    if: ${{ !cancelled() && !contains(github.event.head_commit.message, 'ci skip') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      OS: windows
    steps: *verdict-steps
