name: Dependency Submission

# Submits the project's Gradle dependency graph to GitHub so
# Dependabot can track transitive dependencies accurately. Runs ONLY
# on default-branch pushes (per the job `if:` below) — PRs and
# feature branches should not mutate the project's authoritative
# dependency graph state.
#
# Decoupled from build.yml (which still resolves dependencies for
# the build/check matrix but no longer submits) for three reasons:
#   1. lets build.yml run with `contents: read` instead of `write`
#      (least-priv hygiene; sibling fluxo-kmp-conf does the same)
#   2. graph submission failure no longer takes down the build matrix
#   3. removes a hidden coupling between OS-matrix expansion and the
#      number of redundant graph submissions per push

on:
  push:
    # Mirror build.yml's paths-ignore so doc-only pushes don't
    # trigger a graph submission.
    paths-ignore:
      - '**.*ignore'
      - '**.md'
      - '**.txt'
      - '**/pr-**.yml'
      - '**/release.yml'
      - '**dependabot.yml'
  # `workflow_dispatch` + `schedule` are LOAD-BEARING, not conveniences. Every
  # merge into the protected default branch lands via the `/ff` bot, whose push
  # uses GITHUB_TOKEN — and GitHub deliberately does NOT fire push-triggered
  # workflows on GITHUB_TOKEN pushes (recursion guard). So the `push:` trigger
  # above never fires on a bot-merged default branch; without these two the
  # submitted graph would silently rot (stale transitives → lingering/late
  # Dependabot alerts). `workflow_dispatch` (user/PAT token → not suppressed)
  # gives on-demand re-submission after a dep-changing merge or for recovery;
  # `schedule` keeps freshness hands-off so it never depends on someone
  # remembering to dispatch. The job `if:` (default-branch only) still gates both.
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # `gradle/actions/dependency-submission` needs `contents: write`
  # to attach the graph to the commit via GitHub's dependency-graph
  # API. Scoped narrowly to this single-job workflow.
  contents: write

env:
  CI: true
  BUILD_NUMBER: ${{ github.run_number }}
  SCM_TAG: ${{ github.sha }}

jobs:
  dependency-submission:
    name: Submit Gradle dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-encryption-key: "${{ secrets.GRADLE_ENCRYPTION_KEY }}"
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false
          # Positive allow-list: submit ONLY each project's runtimeClasspath
          # = exactly what ships to consumers (here just java-diff-utils;
          # BCV is compileOnly / consumer-provided, so not shipped). The
          # prior negative `^(?!(classpath)).*` tried to drop build tooling
          # by config NAME, but the settings plugin-resolution classpath is
          # NOT named `classpath`, so Develocity (protobuf, grpc-netty-
          # shaded), Sigstore/fluxo-kmp-conf (BouncyCastle) and commons-io
          # leaked in as 9 false maven Dependabot alerts on never-shipped
          # build tooling. A positive list is robust by construction:
          # build-tooling classpaths are never named `runtimeClasspath`.
          # Anchored so `testRuntimeClasspath` (test deps) is excluded too;
          # scales to future published JVM modules (each has runtimeClasspath).
          dependency-graph-include-configurations: "^runtimeClasspath$"
          dependency-graph-include-projects: "^:(?!(buildSrc|test|check)).*"
          artifact-retention-days: 1
