# Central declaration of dependencies (Gradle Version Catalog)
# https://docs.gradle.org/current/userguide/platforms.html#sub:conventional-dependencies-toml

# Declaring Rich and/or Ranged Versions
# https://docs.gradle.org/current/userguide/rich_versions.html
# https://docs.gradle.org/current/userguide/single_versions.html


[versions]

fluxoBcvJs = "1.1.0"

# Public API management tool
# https://github.com/Kotlin/binary-compatibility-validator/releases
# 0.13+ uses Kotlin metadata 0.6.0 (may conflict with AtomicFU!)
bcv = "0.18.2"
bcvMin = "0.8.0"
bcvLatest = "0.18.2"
# `checks/middle` matrix interior: first BCV with the worker-isolation
# classpath boundary. No alias references it, so Dependabot leaves it alone.
bcvMiddle = "0.16.3"

# java-diff-utils: the plugin's ONLY runtime dependency (formats the apiCheck
# failure diff; pass/fail is a plain line comparison). Track the newest.
# Coexistence: with the external BCV plugin applied, both plugins share one
# plugin classpath, Gradle resolves ONE version (the highest), so BCV runs on
# ours. BCV 0.14+ calls only `DiffUtils.diff(List, List)` and
# `UnifiedDiffUtils.generateUnifiedDiff(String, String, List, Patch, int)`;
# BCV <= 0.13 uses a different library (`difflib`); KGP-embedded validation
# loads its tools in an isolated classpath. Re-verify on each bump:
# `javap -s` both methods in the new jar, `javap -c` BCV's
# `kotlinx/validation/KotlinApiCompareTask` for the methods it calls, and
# confirm the jar is still Java 8 bytecode (major 52).
diffutils = "4.17"

# Java/Kotlin compatibility, aligned with BCV.
# `kotlinLangVersion` is the lowest source-language version the
# Kotlin 2.3+ compiler still accepts. Consumer runtime compat for
# `kotlinMin = 1.7.22` is preserved via JVM bytecode target 1.8 plus
# `-Xskip-metadata-version-check` (build.gradle.kts), NOT via source
# language version. Kotlin 2.3 dropped `languageVersion = 1.7/1.8`.
# https://github.com/Kotlin/binary-compatibility-validator/blob/0.13.2/build.gradle.kts#L101
javaLangTarget = "1.8"
kotlinLangVersion = "2.0"
kotlinApiVersion = "2.0"

# Kotlin version, aligned with BCV
# https://github.com/Kotlin/binary-compatibility-validator/blob/0.13.2/gradle.properties#L4
# https://mvnrepository.com/artifact/org.jetbrains.kotlin/kotlin-gradle-plugin
# https://github.com/JetBrains/kotlin/releases
# Build-side `kotlin` MUST stay on a stable release — RC compilers can
# emit bytecode/metadata quirks that leak into the published plugin
# JAR. `kotlin` also drives `checks/dual` (a consumer cell on the newest
# stable release).
kotlin = "2.4.20"
kotlinMin = "1.7.22"
# `kotlinLatest` drives `checks/latest` and `checks/kgp-only` only — not the
# published JAR — so tracking the newest Kotlin preview is acceptable. The
# plugin's discovery glob accepts `.d.ts` AND `.d.mts` (commit 7b91ad4),
# so Kotlin 2.4's ESM-form wasmJs declarations are picked up natively.
# Trip-wire: if a preview breaks those cells for an upstream reason, pin
# back to the newest working release, citing the failing issue here.
kotlinLatest = "2.5.0-Beta1"
# `checks/middle` matrix interior: a 2.x stable line below the ceiling.
kotlinMiddle = "2.2.21"

# Dokka is a documentation engine for Kotlin/Java
# https://github.com/Kotlin/dokka/releases
# https://mvnrepository.com/artifact/org.jetbrains.dokka/dokka-gradle-plugin?repo=space-kotlin-dokka-dev
dokka = "2.2.0"


[libraries]

diffutils = { module = "io.github.java-diff-utils:java-diff-utils", version.ref = "diffutils" }

plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-binCompatValidator = { module = "org.jetbrains.kotlinx:binary-compatibility-validator", version.ref = "bcv" }


[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-sam-receiver = { id = "org.jetbrains.kotlin.plugin.sam.with.receiver", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }

# https://mvnrepository.com/artifact/com.android.lint/com.android.lint.gradle.plugin?repo=google
# https://maven.google.com/web/index.html#com.android.lint:com.android.lint.gradle.plugin
android-lint = { id = "com.android.lint", version = "9.2.1" }

kotlinx-binCompatValidator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }

# Convenience Gradle plugin
# https://github.com/fluxo-kt/fluxo-kmp-conf/releases
# https://plugins.gradle.org/plugin/io.github.fluxo-kt.fluxo-kmp-conf
fluxo-conf = { id = "io.github.fluxo-kt.fluxo-kmp-conf", version = "0.15.1" }

# Publish plugins to the Gradle Plugin Portal
# https://plugins.gradle.org/plugin/com.gradle.plugin-publish
gradle-plugin-publish = { id = "com.gradle.plugin-publish", version = "2.2.1" }

# Plugin that guards against unintentional dependency changes
# https://github.com/dropbox/dependency-guard/releases
deps-guard = { id = "com.dropbox.dependency-guard", version = "0.5.0" }

# Gradle Doctor: helps diagnose and fix common build problems.
# https://runningcode.github.io/gradle-doctor/
# https://plugins.gradle.org/plugin/com.osacky.doctor
gradle-doctor = { id = "com.osacky.doctor", version = "0.12.1" }

# Sigstore keyless signing for SLSA provenance.
# Signs the plugin JAR + plugin marker POM alongside the existing PGP
# signature required by Gradle Plugin Portal — Sigstore is additive,
# not a replacement. Uses GitHub Actions OIDC in CI; falls back to
# browser-based OIDC locally (so `:plugin:sigstoreSign` works on a
# developer's workstation too, but the publication chain only invokes
# it via release.yml).
# https://github.com/sigstore/sigstore-java/releases
# https://plugins.gradle.org/plugin/dev.sigstore.sign
sigstore-sign = { id = "dev.sigstore.sign", version = "2.3.0" }
