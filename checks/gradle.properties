# Shared by the KMP check builds via symlinks (checks/<cell>/gradle.properties).
#
# Consumer builds run the plugin under strict configuration cache because real
# consumers increasingly do (Gradle 9 makes CC the preferred mode); a CC problem
# in the plugin must fail a check, not surface in a user's build.
#
# Not a symlink to the root gradle.properties: its
# `kotlin.stdlib.default.dependency=false` is right for the plugin JAR and wrong
# for KMP consumer modules (it would strip their stdlib).
# checks/js-only has no link: Gradle 7.6 + Kotlin 1.7 is not a CC-supported pair.

org.gradle.jvmargs=-Xmx1G -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.parallel=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.configuration-cache.max-problems=0
